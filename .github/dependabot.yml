version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Brussels
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns: ["*"]
    # Major action bumps since fe58f51 made Codecov process uploads as 0%.
    ignore:
      - dependency-name: codecov/codecov-action
        update-types: ["version-update:semver-major"]
      - dependency-name: actions/checkout
        update-types: ["version-update:semver-major"]
    labels:
      - dependencies
      - github-actions

  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Brussels
    open-pull-requests-limit: 1
    groups:
      gradle-minor-patch:
        patterns: ["*"]
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: com.android.tools.build:gradle
        update-types: ["version-update:semver-major"]
    labels:
      - dependencies
      - gradle

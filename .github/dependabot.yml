version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Brussels
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns: ["*"]
    labels:
      - dependencies
      - github-actions

  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Brussels
    open-pull-requests-limit: 1
    groups:
      gradle-minor-patch:
        patterns: ["*"]
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - gradle

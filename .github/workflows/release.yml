name: Release

# Manual release only — creates GitHub Release + APK (same as scripts/release.sh).
# README links to /releases/latest keep working after you run this.
#
# Required repo secrets:
#   LOCALCHAT_KEYSTORE_PASS
# Optional:
#   LOCALCHAT_KEYSTORE_BASE64  (release keystore file, if not in repo)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK + CMake
        run: |
          sdkmanager --install "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Fetch llama.cpp
        run: bash scripts/fetch-llama-cpp.sh

      - name: Prepare signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.LOCALCHAT_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > localchat-release.keystore
          elif [ ! -f localchat-release.keystore ]; then
            echo "Add LOCALCHAT_KEYSTORE_BASE64 secret or commit keystore for CI releases." >&2
            exit 1
          fi

      - name: Build signed release APK
        env:
          LOCALCHAT_KEYSTORE_PASS: ${{ secrets.LOCALCHAT_KEYSTORE_PASS }}
        run: |
          if [ -z "$LOCALCHAT_KEYSTORE_PASS" ]; then
            echo "Set LOCALCHAT_KEYSTORE_PASS in repository secrets." >&2
            exit 1
          fi
          chmod +x gradlew
          bash scripts/gradle-release.sh
          bash scripts/verify-apk.sh dist/app-release.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          LOCALCHAT_KEYSTORE_PASS: ${{ secrets.LOCALCHAT_KEYSTORE_PASS }}
        run: bash scripts/release.sh

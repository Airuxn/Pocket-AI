name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install NDK + CMake
        run: |
          sdkmanager --install "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Fetch llama.cpp
        run: bash scripts/fetch-llama-cpp.sh

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew test --build-cache --no-daemon

      - name: Generate coverage report
        run: ./gradlew :app:createDebugUnitTestCoverageReport --no-daemon

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: app/build/reports/coverage/test/debug/report.xml
          fail_ci_if_error: false
          verbose: true

      - name: Lint app and SDK module
        run: ./gradlew lint :llama-bro-sdk:lint --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify debug APK contents
        run: bash scripts/verify-apk.sh app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Benchmark smoke (parse + capabilities sync)
        run: |
          python3 -m py_compile scripts/prompt-benchmark/benchmark.py
          python3 -m py_compile scripts/prompt-benchmark/tool_benchmark.py
          python3 -m py_compile scripts/prompt-benchmark/inject_benchmark.py
          python3 -m py_compile scripts/prompt-benchmark/run_all.py
          python3 -c "import json; json.load(open('scripts/prompt-benchmark/capabilities.json')); json.load(open('app/src/main/assets/capabilities.json'))"
          diff -q scripts/prompt-benchmark/capabilities.json app/src/main/assets/capabilities.json
